name: HF Debug
on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Model ID"
        required: true
        type: string

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check HF identity
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub -q
          python3 -c "from huggingface_hub import HfApi; api=HfApi(token='$HF_TOKEN'); me=api.whoami(); print('User:', me['name'])"

      - name: Download model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "Model: ${{ github.event.inputs.model_id }}"
          python3 -u scripts/download_model.py "${{ github.event.inputs.model_id }}" 2>&1
          echo "---VERIFY---"
          du -sh /tmp/model_output/${{ github.event.inputs.model_id }}

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.model_id }}-${{ github.run_id }}
          path: /tmp/model_output/${{ github.event.inputs.model_id }}
          retention-days: 1
          overwrite: true
