name: HF Debug
on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Model ID"
        required: true
        type: string

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check HF identity
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub -q
          python3 -c "from huggingface_hub import HfApi; api=HfApi(token='$HF_TOKEN'); me=api.whoami(); print('User:', me['name'])"

      - name: Download model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "Model: ${{ github.event.inputs.model_id }}"
          python3 -u scripts/download_model.py "${{ github.event.inputs.model_id }}" "" 2>&1 | tee /tmp/download_output.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Upload manifest
        if: always()
        run: |
          echo "Download exit code: $(tail -1 /tmp/download_output.txt | grep exit_code || echo 'unknown')"
          ls -la /tmp/model_cache/ 2>/dev/null || echo "Cache dir not found"
          find /tmp/model_cache -type f 2>/dev/null | head -20 || echo "No cache files"
