name: HF Model Download
on:
  workflow_dispatch:
    inputs:
      model_id:
        description: 'Model'
        required: true
        default: 'TinyLlama/TinyLlama-1.1B-Chat-v1.0'
      target_space:
        description: 'HF Space'
        required: false
        default: ''

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        env:
          HF_TOKEN: \${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub -q
          python3 << 'PYEOF'
import os, sys
from huggingface_hub import HfApi, snapshot_download
model_id = "${{ github.event.inputs.model_id }}"
target = "${{ github.event.inputs.target_space }}"
token = os.environ.get("HF_TOKEN","")
api = HfApi(token=token)
me = api.whoami()
print("User:", me["name"])
local_dir = snapshot_download(repo_id=model_id, token=token, cache_dir="/tmp/model_dl")
print("Downloaded:", local_dir)
if target:
    space = target.split("/")[-1] if "/" in target else target
    full = me["name"] + "/" + space
    try:
        api.create_repo(repo_id=full, repo_type="space", space_sdk="docker", space_hardware="small", exist_ok=True, repo_visibility="private")
        print("Space ready:", full)
    except Exception as e:
        print("Space note:", e)
    api.upload_folder(folder_path=local_dir, repo_id=full, repo_type="model", commit_message="Upload " + model_id)
    print("Uploaded! https://huggingface.co/" + full)
else:
    print("No upload (target_space empty)")
PYEOF
