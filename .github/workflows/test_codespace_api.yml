name: Test Codespace API
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: List codespaces
        run: |
          echo "=== LIST CODESPACES ===" > $GITHUB_OUTPUT
          curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/user/codespaces" > /tmp/codespaces.json
          cat /tmp/codespaces.json | python3 -c \
            "import sys,json;d=json.load(sys.stdin);print('total:',d.get('total_count'));[(print(' -',c.get('name'),c.get('state'),c.get('location'))) for c in d.get('codespaces',[])]"
          echo "codespaces_json=$(cat /tmp/codespaces.json | python3 -c 'import sys,json;print(json.dumps(json.load(sys.stdin)))')" >> $GITHUB_OUTPUT

      - name: Get specific codespace
        run: |
          curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/user/codespaces/opulent-guacamole-5vq7g4r6wrwqhvrj" > /tmp/cs.json
          cat /tmp/cs.json | python3 -c \
            "import sys,json;d=json.load(sys.stdin);print(json.dumps(d,indent=2)[:2000])"
          echo "cs_json=$(cat /tmp/cs.json | python3 -c 'import sys,json;print(json.dumps(json.load(sys.stdin)))')" >> $GITHUB_OUTPUT

      - name: Try start
        run: |
          echo "=== POST start ==="
          curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/user/codespaces/opulent-guacamole-5vq7g4r6wrwqhvrj/start" | head -5
          
      - name: Check CS permissions
        run: |
          echo "=== permissions check ==="
          curl -s -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/codespaces?per_page=10" | python3 -c \
            "import sys,json;d=json.load(sys.stdin);print(json.dumps(d,indent=2)[:1000])"
