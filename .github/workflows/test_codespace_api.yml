name: Test Codespace API
on:
  workflow_dispatch:
permissions:
  codespaces: write
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check token info
        run: |
          echo "=== gh auth ==="
          gh auth status
          
      - name: Get user info
        run: |
          curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/user" | python3 -c \
            "import sys,json;d=json.load(sys.stdin);print('login:', d.get('login'), 'id:', d.get('id'))"

      - name: List codespaces with PAT
        env:
          PAT: ${{ secrets.GH_PAT_FOR_CS }}
        run: |
          echo "=== LIST with PAT ==="
          curl -s -H "Authorization: token $PAT" \
            "https://api.github.com/user/codespaces" | python3 -c \
            "import sys,json;d=json.load(sys.stdin);print('total:',d.get('total_count'));[(print(' -',c.get('name'),c.get('state'),c.get('location'))) for c in d.get('codespaces',[])]"

      - name: Get specific codespace
        env:
          PAT: ${{ secrets.GH_PAT_FOR_CS }}
        run: |
          echo "=== SPECIFIC ==="
          curl -s -H "Authorization: token $PAT" \
            "https://api.github.com/user/codespaces/opulent-guacamole-5vq7g4r6wrwqhvrj" | python3 -c \
            "import sys,json;d=json.load(sys.stdin);print(json.dumps(d,indent=2)[:1500])"

      - name: Start codespace
        env:
          PAT: ${{ secrets.GH_PAT_FOR_CS }}
        run: |
          echo "=== START ==="
          curl -s -X POST -H "Authorization: token $PAT" \
            "https://api.github.com/user/codespaces/opulent-guacamole-5vq7g4r6wrwqhvrj/start" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(json.dumps(d,indent=2)[:500])"
