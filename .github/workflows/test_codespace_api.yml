name: Test Codespace API
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check gh auth
        run: |
          echo "=== gh auth ==="
          gh auth status 2>&1 || true

      - name: Get user info
        run: |
          curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/user" | python3 -c \
            "import sys,json;d=json.load(sys.stdin);print(d.get('login'), d.get('id'))"

      - name: List codespaces
        run: |
          curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/user/codespaces" | python3 -c \
            "import sys,json;d=json.load(sys.stdin);print('total:',d.get('total_count'));[(print(' -',c.get('name'),c.get('state'))) for c in d.get('codespaces',[])]"

      - name: Get specific codespace
        run: |
          curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/user/codespaces/opulent-guacamole-5vq7g4r6wrwqhvrj" | python3 -c \
            "import sys,json;print(json.dumps(json.load(sys.stdin),indent=2)[:1500])"

      - name: Try start endpoint
        run: |
          curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/user/codespaces/opulent-guacamole-5vq7g4r6wrwqhvrj/start" | head -3
