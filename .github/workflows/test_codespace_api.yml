name: Test Codespace API
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check PAT scopes via gh cli
        run: |
          gh auth status 2>&1 || true
          echo "---"
          gh api user --jq '.login, .id'
          
      - name: List codespaces via gh
        run: |
          echo "=== List all codespaces ==="
          gh api /user/codespaces --jq '.total_count, .codespaces[]?.name, .codespaces[]?.state' 2>&1
          
      - name: Get specific codespace
        run: |
          echo "=== Get opulent-guacamole ==="
          gh api /user/codespaces/opulent-guacamole-5vq7g4r6wrwqhvrj --jq '.name, .state, .git_status, .pull_request.url' 2>&1
          
      - name: Try codespace SSH info
        run: |
          echo "=== Codespace SSH keys ==="
          gh api /user/codespaces/opulent-guacamole-5vq7g4r6wrwqhvrj/SSH_keys 2>&1 | head -5 || echo "endpoint may not exist"
