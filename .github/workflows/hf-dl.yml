name: HF Model Download
on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Model ID"
        required: true
        type: string
      target_space:
        description: "HF Space name"
        required: false
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Check identity
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub -q
          python3 -c "from huggingface_hub import HfApi; api=HfApi(token='$HF_TOKEN'); me=api.whoami(); print('User:', me['name'])"

      - name: Write script
        run: |
          python3 -c "open('/tmp/dl.py','w').write('''import os,sys
from huggingface_hub import snapshot_download,HfApi
model_id=sys.argv[1]
target=sys.argv[2] if len(sys.argv)>2 else os.environ.get('HF_TOKEN','')
token=os.environ.get("HF_TOKEN","")
dl=snapshot_download(repo_id=model_id,token=token,cache_dir="/tmp/md")
print('Downloaded:',dl)
if sys.argv[2]:
 api=HfApi(token=token);me=api.whoami()
 space=sys.argv[2].split("/")[-1]
 full=me["name"]+"/"+space
 try: api.create_repo(repo_id=full,repo_type="space",space_sdk="docker",space_hardware="small",exist_ok=True,repo_visibility="private")
 except: pass
 api.upload_folder(folder_path=dl,repo_id=full,repo_type="model",commit_message="Upload "+model_id)
 print('Uploaded: https://huggingface.co/'+full)
else: print('No upload')
'''); print('written')"

      - name: Run download
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 /tmp/dl.py "${{ github.event.inputs.model_id }}" "${{ github.event.inputs.target_space }}"
