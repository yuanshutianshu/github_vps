name: HF Register via API
on: workflow_dispatch
jobs:
  hf-register:
    runs-on: ubuntu-latest
    steps:
      - name: Register HF via API
        run: |
          pip install huggingface_hub requests -q 2>&1 | tail -1
          python3 << 'PYEOF'
import requests, json, os
HF_EMAIL = "yuanshu@claw.163.com"
HF_GH_USER = "yuanshutianshu"
HF_GH_TOKEN = os.environ.get('GH_TOKEN', '')

print("=== Try HF API-based registration ===")

# 1. Check if HF accepts GitHub OAuth token to pre-create account
# HF has an API at /api/register
resp = requests.post(
    "https://huggingface.co/api/register",
    json={"email": HF_EMAIL, "password": "Yuanshu123~!@#", "agreeTerms": "true"},
    headers={"Content-Type": "application/json"},
    timeout=10
)
print(f"Register API: {resp.status_code} {resp.text[:200]}")

# 2. Try login API
resp = requests.post(
    "https://huggingface.co/api/login",
    json={"username": HF_EMAIL, "password": "Yuanshu123~!@#"},
    headers={"Content-Type": "application/json"},
    timeout=10
)
print(f"Login API: {resp.status_code} {resp.text[:300]}")

# 3. Check if there's a GitHub OAuth callback API
resp = requests.get(
    "https://huggingface.co/oauth-licensed/callback",
    params={"code": "test", "state": "test"},
    allow_redirects=False,
    timeout=10
)
print(f"OAuth callback: {resp.status_code} loc:{resp.headers.get('location','none')[:100]}")
PYEOF
