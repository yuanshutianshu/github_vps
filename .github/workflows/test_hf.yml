name: Register HF Account
on: workflow_dispatch
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Install HF CLI
        run: |
          pip install huggingface_hub[cli] 2>&1 | tail -5
      - name: Test HF access
        run: |
          echo "=== Test HF API ==="
          curl -s https://huggingface.co/api/whoami-v2 || echo "Not logged in"
          echo ""
          echo "=== HF CLI version ==="
          hf --version 2>&1 || echo "hf not found"
