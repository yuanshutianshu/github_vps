name: HF Download Real
on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Model"
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        env:
          HF_TOKEN: \${{ secrets.HF_TOKEN }}
        run: |
          python3 << 'PYEOF'
import os
model_id = "${{ github.event.inputs.model_id }}"
print("Model:", model_id)
PYEOF
