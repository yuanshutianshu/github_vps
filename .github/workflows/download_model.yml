name: Download Small Model
on:
  workflow_dispatch:
    inputs:
      model_id:
        description: 'Model ID (e.g. TinyLlama/TinyLlama-1.1B-Chat-v1.0)'
        required: true
        default: 'TinyLlama/TinyLlama-1.1B-Chat-v1.0'

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download model from HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface-hub -q 2>&1 | tail -1
          
          python3 << 'PYEOF'
          import os
          from huggingface_hub import hf_hub_download, list_repo_files, snapshot_download
          
          model_id = "${{ github.event.inputs.model_id }}"
          token = os.environ.get("HF_TOKEN", "")
          
          print(f"=== Downloading {model_id} ===")
          
          files = list_repo_files(model_id, token=token)
          print(f"Total files: {len(files)}")
          for f in files:
              print(f"  {f}")
          
          save_dir = f"/tmp/model_cache/{model_id.replace('/', '_')}"
          os.makedirs(save_dir, exist_ok=True)
          
          print(f"\nDownloading to {save_dir} ...")
          local_dir = snapshot_download(
              repo_id=model_id,
              token=token,
              cache_dir=save_dir,
              ignore_patterns=["*.msgpack", "*.h5", "*.ot"],
          )
          print(f"Downloaded to: {local_dir}")
          print("DONE")
          PYEOF
